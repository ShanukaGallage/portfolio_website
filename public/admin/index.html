<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Content Manager</title>
  <!-- Explicitly tell Decap CMS where the config file is, preventing 404s on /admin without trailing slash -->
  <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url">
</head>
<body>
  <script>
    // DECAP CMS OAUTH DEBUGGER
    const originalAddEventListener = window.addEventListener;
    window.addEventListener = function(type, listener, options) {
      if (type === 'message' && typeof listener === 'function') {
        const originalListener = listener;
        listener = function(e) {
          if (typeof e.data === 'string' && e.data.includes('authorization')) {
            console.log('🚀 [DECAP DEBUGGER] Message Received!');
            console.log('- e.origin:', e.origin);
            console.log('- e.data:', e.data);
            console.log('- this.auth_url:', this.auth_url);
            console.log('- this.auth_type:', this.auth_type);
            console.log('- e.source === this.authWindow:', e.source === this.authWindow);
            
            // Bypass strict origin check if it's the only thing failing
            if (this.auth_url && this.auth_url !== e.origin) {
              console.warn('⚠️ [DECAP DEBUGGER] Origin mismatch detected! Forcing auth_url to match e.origin.');
              this.auth_url = e.origin;
            }
            // Bypass strict e.source check if it's failing
            if (this.authWindow && e.source !== this.authWindow) {
               console.warn('⚠️ [DECAP DEBUGGER] e.source mismatch detected! Forcing e.source check bypass.');
               this.authWindow = e.source;
            }
          }
          return originalListener.apply(this, arguments);
        };
      }
      return originalAddEventListener.call(window, type, listener, options);
    };
  </script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
